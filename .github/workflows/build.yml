# Builds the Android APK of Lekto and publishes it as a release here. The app's code is in a
# private repo, which asks for each build by repository_dispatch with the commit to build; this
# repo reads it with a read-only deploy key. Nothing but the APK is published: no artifacts, and
# the steps print as little as they can, since these logs are public.
name: Build and release

on:
  repository_dispatch:
    types: [build]

permissions:
  contents: write

# One build at a time, in the order asked: each one's number is the APK's versionCode.
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHA: ${{ github.event.client_payload.sha }}
    steps:
      - name: Check out the app at the commit asked for
        uses: actions/checkout@v4
        with:
          repository: javadbayzavi/my-class-note-picker
          ref: ${{ github.event.client_payload.sha }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          persist-credentials: false
          path: app

      - uses: actions/setup-node@v4
        with:
          node-version-file: app/.nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund --loglevel=error

      - name: Make the Android project
        working-directory: app
        env:
          CI: 1
          LEKTO_BUILD_NUMBER: ${{ github.run_number }}
        run: npx expo prebuild --platform android --clean > /dev/null

      - name: Build the APK, signed with the upload key
        working-directory: app/android
        env:
          NODE_ENV: production
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          ORG_GRADLE_PROJECT_LEKTO_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_LEKTO_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_LEKTO_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          keystore="$RUNNER_TEMP/upload.keystore"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$keystore"
          export ORG_GRADLE_PROJECT_LEKTO_UPLOAD_STORE_FILE="$keystore"
          # Only 64-bit ARM, which every phone it is for has: the other three would more than double
          # the APK for nothing. Builds on a laptop keep all four, for the emulator.
          ./gradlew assembleRelease --quiet --console=plain -PreactNativeArchitectures=arm64-v8a
          rm -f "$keystore"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.client_payload.notes }}
          BUILD: ${{ github.run_number }}
        run: |
          version=$(node -p "require('./app/app.json').expo.version")
          tag="v$version-$BUILD"
          apk="$RUNNER_TEMP/lekto-$version-$BUILD.apk"
          cp app/android/app/build/outputs/apk/release/app-release.apk "$apk"

          # What the notes add to what is new, read from the APK itself.
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          min_sdk=$("$tools/aapt2" dump badging "$apk" | sed -n "s/^minSdkVersion:'\([0-9]*\)'.*/\1/p")
          certificate=$("$tools/apksigner" verify --print-certs "$apk" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 | tr a-f A-F | sed 's/../&:/g; s/:$//')
          checksum=$(sha256sum "$apk" | cut -d' ' -f1)
          android=$(node -p "({ 24: '7.0', 25: '7.1', 26: '8.0', 27: '8.1', 28: '9', 29: '10', 30: '11', 31: '12', 32: '12L', 33: '13', 34: '14', 35: '15', 36: '16' })[$min_sdk] ?? 'API $min_sdk'")
          # The backticks are Markdown's, for the checksums: not meant to expand.
          # shellcheck disable=SC2016
          {
            printf '%s\n\n' "${NOTES:-A new build.}"
            printf -- '---\n\n'
            printf '**Version** %s (build %s) · %s\n\n' "$version" "$BUILD" "$(date -u +%Y-%m-%d)"
            printf '**Needs** Android %s or later, on a 64-bit ARM phone, and your own Gemini API key from Google AI Studio (free, no billing).\n\n' "$android"
            printf 'Installs over the previous release and keeps your notes.\n\n'
            printf '**APK SHA-256** `%s`\n\n' "$checksum"
            printf '**Signing certificate SHA-256** `%s` (the same for every release)\n' "$certificate"
          } > "$RUNNER_TEMP/notes.md"

          gh release create "$tag" "$apk" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Lekto $version ($BUILD)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
